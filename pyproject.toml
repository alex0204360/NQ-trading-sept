[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nq-patterns"
version = "0.2.0"
description = "Preregistered short-horizon NQ pattern research and OHLCV matching"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scipy==1.17.0",
  "scikit-learn==1.8.0",
  "threadpoolctl==3.6.0",
  "statsmodels==0.15.0",
  "pyarrow==25.0.1",
  "kagglehub==1.0.2",
  "pandas-market-calendars==5.4.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.6", "build==1.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nqpatterns"]

[tool.ruff]
line-length = 100
target-version = "py312"
